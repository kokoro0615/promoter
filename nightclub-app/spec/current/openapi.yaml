openapi: 3.1.1
info:
  title: Nightclub v4 R1 Core API Design
  version: 4.0.0
  description: 開発用コア契約。未実装。ユーザー確定：名前検索中心、入口も通常承認、入口共用端末。R1全機能の詳細化状況はapi/coverage.mdを参照。実サービスURL・認証基盤・PSPは未確定。
servers:
- url: https://api.example.invalid/v1
  description: 非実在の例示URL。実接続先ではない。
security: &id001
- PersonalSession: []
- DeviceSession: []
  OperatorSession: []
paths:
  /auth/line/start:
    get:
      operationId: startLineLogin
      tags:
      - Core
      summary: 個人LINEログイン開始
      description: 'state・nonce・PKCE S256を生成。callbackは選定認証基盤の認証設計で別管理。


        権限：public。公開経路でもレート制限・適用範囲・冪等性をサーバーで検証。'
      security: []
      x-permission: public
      x-requirement-ids:
      - V3-ID-02
      responses:
        '200':
          description: 成功（外部処理待ちは状態で明示）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginStart'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /me:
    get:
      operationId: getMe
      tags:
      - Core
      summary: 現在の主体と権限
      description: '


        権限：session.read。入口モードでは有効な端末・担当者・当日役割を検証。主体IDをbodyで偽装できない。'
      security: *id001
      x-permission: session.read
      x-requirement-ids:
      - V3-ID-01
      - V4-KSK-03
      responses:
        '200':
          description: 成功（外部処理待ちは状態で明示）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorContext'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/OperatorContext'
  /auth/logout:
    post:
      operationId: logout
      tags:
      - Core
      summary: セッション失効
      description: '


        権限：session.end。入口モードでは有効な端末・担当者・当日役割を検証。主体IDをbodyで偽装できない。'
      security: *id001
      x-permission: session.end
      x-requirement-ids:
      - V3-ID-06
      responses:
        '200':
          description: 成功（外部処理待ちは状態で明示）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/OperatorContext'
  /stores/{storeId}/devices/enrollments:
    post:
      operationId: createEnrollment
      tags:
      - Identity
      summary: 共用端末を招待
      description: '


        権限：device.enroll。入口モードでは有効な端末・担当者・当日役割を検証。主体IDをbodyで偽装できない。'
      security: *id001
      x-permission: device.enroll
      x-requirement-ids:
      - V4-KSK-01
      responses:
        '201':
          description: 成功（外部処理待ちは状態で明示）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      parameters:
      - name: storeId
        in: path
        required: true
        schema: &id003
          type: string
          format: uuid
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/OperatorContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentCreate'
  /device/enroll:
    post:
      operationId: consumeEnrollment
      tags:
      - Identity
      summary: 短期コードで端末資格情報を発行
      description: 'コードの当て推量防止とCSRF/Origin検証を行う。業務権限はまだ付与しない。


        権限：pairing.code。公開経路でもレート制限・適用範囲・冪等性をサーバーで検証。'
      security: []
      x-permission: pairing.code
      x-requirement-ids:
      - V4-KSK-01
      responses:
        '200':
          description: 成功（外部処理待ちは状態で明示）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
          headers:
            Set-Cookie:
              description: Secure; HttpOnly; SameSite属性付きのサーバーセッション。値はレスポンス本文に返さない。
              schema: &id002
                type: string
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentConsume'
  /device/operators:
    get:
      operationId: listDeviceOperators
      tags:
      - Identity
      summary: 当日担当者の最小候補
      description: '


        権限：device.unlock。入口モードでは有効な端末・担当者・当日役割を検証。主体IDをbodyで偽装できない。'
      security:
