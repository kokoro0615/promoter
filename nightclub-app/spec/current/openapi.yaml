      - planned_count
      - segments
      additionalProperties: false
    VisitUpdate:
      type: object
      properties:
        expected_version: *id005
        reception_name:
          type: string
          minLength: 1
          maxLength: 100
        reading:
          type: string
          minLength: 0
          maxLength: 100
        arrival_status:
          type: string
          enum:
