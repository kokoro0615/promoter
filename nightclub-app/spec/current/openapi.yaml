components:
  securitySchemes:
    PersonalSession:
      type: apiKey
      in: cookie
      name: __Host-nc_personal
    DeviceSession:
      type: apiKey
      in: cookie
      name: __Host-nc_device
    OperatorSession:
      type: apiKey
      in: cookie
      name: __Host-nc_operator
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 160
      description: 同じ業務操作は同じキー。異なるpayloadへの流用は409。金銭は保存済み参照も照合。
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: *id002
      description: cookie認証の状態変更に必要。Origin/Fetch Metadataも検証。
    OperatorContext:
      name: X-Operator-Context
      in: header
      required: false
      schema: *id003
      description: 入口モードでは必須。画面描画時のoperator_session_id。認証手段ではない。cookie主体とサーバーactive sessionに一致しなければ409 OPERATOR_CHANGED。個人モードでは不要。
  schemas:
    Problem:
      type: object
      properties:
        type: *id002
        title: *id002
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail: *id002
        code: *id002
        trace_id: *id003
        current_version:
          type:
          - integer
          - 'null'
        retryable:
          type: boolean
        field_errors:
          type: array
          items:
            type: object
            properties:
              path: *id002
              code: *id002
              message: *id002
            required:
            - path
            - code
            - message
            additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - trace_id
      - retryable
      additionalProperties: false
    Ack:
      type: object
      properties:
        accepted:
          type: boolean
        trace_id: *id003
      required:
      - accepted
      - trace_id
      additionalProperties: false
    CommandResult:
      type: object
      properties:
        resource_id: *id003
        version: &id005
          type: integer
          minimum: 1
        status: *id002
        trace_id: *id003
        operation_key: *id002
      required:
      - resource_id
      - version
      - status
      - trace_id
      additionalProperties: false
    VersionCommand:
      type: object
      properties:
        expected_version: *id005
      required:
      - expected_version
      additionalProperties: false
    ReasonCommand:
      type: object
      properties:
        expected_version: *id005
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - expected_version
      - reason
      additionalProperties: false
    ActorContext:
      type: object
      properties:
        user_id: *id003
        membership_id: *id003
        store_id: *id003
        display_name: *id002
        permissions:
          type: array
          items: *id002
        mode:
          type: string
          enum:
          - PERSONAL
          - ENTRANCE
        operator_session_id: &id006
          type:
          - string
          - 'null'
          format: uuid
        device_id: *id006
        event_id: *id006
      required:
      - user_id
      - membership_id
      - store_id
      - display_name
      - permissions
      - mode
      - operator_session_id
      - device_id
      - event_id
      additionalProperties: false
    LoginStart:
      type: object
      properties:
        authorization_url:
          type: string
          format: uri
        expires_at: &id007
          type: string
          format: date-time
      required:
      - authorization_url
      - expires_at
      additionalProperties: false
    EnrollmentCreate:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
      required:
      - label
      additionalProperties: false
    EnrollmentResult:
      type: object
      properties:
        enrollment_id: *id003
        pairing_code: *id002
        expires_at: *id007
      required:
      - enrollment_id
