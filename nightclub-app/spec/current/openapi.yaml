    PolicyDocument:
      title: 営業ポリシー版 v4。日時関係・ID所属・枠合計等はサーバー検証が別途必要。
      type: object
      properties:
        schema_version:
          const: 4.0.0
        environment:
          type: string
          enum:
          - EXAMPLE_ONLY
          - PRODUCTION_CONFIG
        event_id:
          type: string
          format: uuid
        timezone:
          type: string
          minLength: 1
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        effective_from:
          type: string
          format: date-time
        effective_to:
          type: string
          format: date-time
        registration_from:
          type: string
          format: date-time
        registration_to:
          type: string
          format: date-time
        apply_mode:
          type: string
          enum:
          - NEW_ONLY
          - REASSESS_UNENTERED
        price_rules:
          type: array
          items:
            type: object
            properties:
              rule_key:
                type: string
                pattern: ^[a-z][a-z0-9_]{1,39}$
              label:
                type: string
                minLength: 1
                maxLength: 80
              kind:
                type: string
                enum:
                - NORMAL
                - DISCOUNT
                - FREE
              amount_minor:
                type: integer
                minimum: 0
              entry_from:
                type: string
                format: date-time
              entry_to:
                type: string
                format: date-time
              payment_required:
                type: boolean
              standard_allowed:
                type: boolean
            required:
            - rule_key
            - label
            - kind
            - amount_minor
            - entry_from
            - entry_to
            - payment_required
            - standard_allowed
            additionalProperties: false
            allOf:
            - if:
                properties:
                  kind:
                    const: FREE
              then:
                properties:
                  amount_minor:
                    const: 0
                  payment_required:
                    const: false
          minItems: 1
        event_free_limit:
          type: object
          properties:
            mode:
              type: string
              enum:
              - UNSET
              - LIMITED
              - UNLIMITED
            value:
              type:
              - integer
              - 'null'
              minimum: 0
          required:
          - mode
          - value
          additionalProperties: false
          allOf:
          - if:
              properties:
                mode:
                  const: LIMITED
            then:
              properties:
                value:
                  type: integer
                  minimum: 0
            else:
              properties:
                value:
                  type: 'null'
        max_party_size:
          type: object
          properties:
            mode:
              type: string
              enum:
              - UNSET
              - LIMITED
              - UNLIMITED
            value:
              type:
              - integer
              - 'null'
              minimum: 0
          required:
          - mode
          - value
          additionalProperties: false
          allOf:
          - if:
              properties:
                mode:
                  const: LIMITED
            then:
              properties:
                value:
                  type: integer
                  minimum: 0
            else:
              properties:
                value:
                  type: 'null'
        approval:
          type: object
          properties:
            designated_member_ids:
              type: array
              items:
                type: string
                format: uuid
              uniqueItems: true
              maxItems: 3
            entrance_regular_approval:
              const: true
            self_approval_allowed:
              type: boolean
              default: false
            renotify_after_seconds:
              type:
              - integer
              - 'null'
              minimum: 30
            escalate_after_seconds:
              type:
              - integer
              - 'null'
              minimum: 30
          required:
          - designated_member_ids
          - entrance_regular_approval
          - self_approval_allowed
          - renotify_after_seconds
          - escalate_after_seconds
          additionalProperties: false
        default_companion_policy:
          type: string
          enum:
          - PRINCIPAL_ONLY
          - LIMITED_COMPANIONS
        customer_match_methods:
          type: array
          items:
            type: string
            enum:
            - KNOWN_BY_STAFF
            - BOOKING_CONTEXT
            - CONTACT_HINT
            - OTHER
          minItems: 1
          uniqueItems: true
        limits_unset_block_publish:
          const: true
      required:
      - schema_version
      - environment
      - event_id
      - timezone
      - currency
      - effective_from
      - effective_to
      - registration_from
      - registration_to
      - apply_mode
      - price_rules
      - event_free_limit
      - max_party_size
      - approval
